---
x-labels-1: &x-labels-1
  - sablier.enable=true
  - sablier.group=opencloud-main

services:
  # main
  opencloud:
    labels: *x-labels-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/.well-known/openid-configuration"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # radicale:
  #   labels: *x-labels-1
  tika:
    labels: *x-labels-1
  # aux - defined in external-proxy/<office-tool>-exposed.yml
